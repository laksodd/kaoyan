<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>考研英语 · 笔记复习</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="考研英语">
<meta name="theme-color" content="#212529">
<script>
/* EdgeOne 访问凭证自种：带令牌打开一次后，写入一年期 Cookie，之后裸域名永久直连 */
(function () {
  try {
    var m = location.search.match(/[?&]eo_token=([^&]+)/), t = location.search.match(/[?&]eo_time=([^&]+)/);
    if (m && t) {
      document.cookie = "eo_token=" + m[1] + "; path=/; max-age=31536000; SameSite=Lax";
      document.cookie = "eo_time=" + t[1] + "; path=/; max-age=31536000; SameSite=Lax";
      history.replaceState(null, "", location.pathname);
    }
  } catch (e) {}
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f6f9;--panel:#fff;--line:#e2e6ee;--text:#1f2328;--dim:#697180;--accent:#2563eb;--accent2:#7c3aed;--pad:20px;--fsT:17px;--fsB:15px;--fsE:14.5px}
html{height:100%}
body{height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text);font-size:15px;line-height:1.8;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px var(--pad);flex:0 0 auto;position:relative;z-index:50}
h1{font-size:17px}
h1 small{font-weight:400;color:var(--dim);font-size:12px;margin-left:8px}
.tools{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.srow{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
input[type=search]{flex:1 1 180px;min-width:0;max-width:360px;padding:8px 12px;font-size:14px;border:1px solid var(--line);border-radius:8px;outline:none;font-family:inherit}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px #2563eb22}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 12px;font-size:13px;cursor:pointer;color:#374151}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip b{font-weight:600;opacity:.75}
.layout{flex:1;min-height:0;display:flex;position:relative}
aside{width:290px;flex:0 0 290px;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:10px 8px 60px}
.tree,.tree ul{list-style:none}
.tree ul{padding-left:10px;margin-left:8px;border-left:1px dashed #c9d2e0}
.node{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:14px}
.node:hover{background:#f1f4f9}
.node.sel{background:#e8efff;color:var(--accent);font-weight:700}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct{font-size:11px;color:var(--dim);background:#f1f3f6;border-radius:9px;padding:0 7px;flex:0 0 auto}
.tri{width:0;height:0;border-left:5px solid #9aa6b8;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .2s;flex:0 0 auto}
.grp.open>.tri{transform:rotate(90deg)}
.grp>.kids{display:none}
.grp.open>.kids{display:block}
main{flex:1;min-width:0;overflow:auto;padding:16px var(--pad) 90px}
#list{max-width:1060px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 19px;margin-bottom:14px;scroll-margin:80px}
.card.flash{animation:fl 1.6s}
@keyframes fl{0%{background:#fff7d6;box-shadow:0 0 0 2px #f59e0b88}100%{background:#fff}}
.chead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ti{font-size:var(--fsT);font-weight:700}
.k{font-size:12px;padding:2px 9px;border-radius:5px;font-weight:700;flex:0 0 auto}
.k.g{background:#eef2ff;color:#4338ca}
.k.w{background:#f0fdf4;color:#15803d}
.k.p{background:#fdf6e3;color:#a16207}
.k.x{background:#f1f5f9;color:#475569}
.times{font-size:11px;color:#b45309;background:#fef3c7;border-radius:9px;padding:1px 8px;cursor:pointer;flex:0 0 auto}
.times:hover{background:#fde68a}
.pop{display:none;background:#fffdf3;border:1px solid #f2e2b3;border-radius:8px;padding:6px 10px;margin-top:6px;font-size:12px}
.pop.open{display:block}
.pop a{color:#b45309;cursor:pointer;text-decoration:none;display:inline-block;margin:2px 8px 2px 0;border-bottom:1px dashed #d9b46a}
.bd{font-size:var(--fsB);color:#374151;white-space:pre-wrap;margin:2px 0 8px}
.ex{font-size:var(--fsE);color:#1f2937;background:#f8fafc;border-left:3px solid #dbe3ef;border-radius:0 6px 6px 0;padding:8px 12px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.rel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.rel .lb{font-size:11px;color:var(--dim)}
.rel a{font-size:12px;color:var(--accent);background:#eef4ff;border-radius:99px;padding:2px 10px;text-decoration:none;cursor:pointer}
.rel a:hover{background:#dce9ff}
.count{font-size:12px;color:var(--dim);white-space:nowrap;margin-left:auto}
.uh{font-size:16px;color:#374151;font-weight:700;margin:16px 0 10px;padding-left:9px;border-left:3px solid var(--accent)}
.fsbox{display:flex;gap:4px;margin-left:auto;flex:0 0 auto}
.empty{color:#a7b0bf;text-align:center;padding:60px 0}
.top{position:fixed;right:18px;bottom:26px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer;display:none;box-shadow:0 4px 14px #0f172a1c;z-index:60}
.top.on{display:block}
.mask{display:none}
@media(max-width:1024px){
 :root{--pad:14px}
 aside{position:absolute;left:0;top:0;bottom:0;z-index:40;width:280px;transform:translateX(-103%);transition:transform .25s}
 body.nav aside{transform:none;box-shadow:3px 0 22px #0f172a2e}
 .mask{display:block;position:absolute;inset:0;z-index:35;background:#0f172a5c;opacity:0;pointer-events:none;transition:opacity .25s}
 body.nav .mask{opacity:1;pointer-events:auto}
 .burger{display:inline-flex;width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:16px;cursor:pointer;align-items:center;justify-content:center}
}
@media(max-width:600px){
 header{padding:8px 12px}h1{font-size:15px}h1 small{display:block;margin-top:2px;font-size:11px}
 main{padding:10px 12px 90px}.card{padding:11px 12px}.ti{font-size:14px}
 input[type=search]{max-width:none}.count{display:none}
 .chips{gap:5px}.chip{padding:2px 10px}
}
/* ===== 扩展：工具按钮 / 收藏 / 夜间 / 背诵 / 相似词群 ===== */
.tbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;color:#374151}
.badge{background:#e5484d;color:#fff;border-radius:9px;font-size:10px;padding:1px 6px;margin-left:4px;font-weight:700;display:inline-block;line-height:14px;vertical-align:1px}

/* ===== 移动端：工具栏折叠 ===== */
.mtool{display:none;align-items:center;margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;font-size:13px;cursor:pointer;color:#374151;flex:0 0 auto}
.mtool.due::after{content:"";display:inline-block;width:7px;height:7px;background:#e5484d;border-radius:50%;margin-left:6px}
@media(max-width:900px){
  .mtool{display:inline-flex}
  .srow{flex-wrap:nowrap}
  .srow input[type=search]{flex:1 1 auto}
  .chips{flex:0 1 170px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .tools{display:none;margin-top:8px}
  body.mopen .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
  body.mopen .tools > button{text-align:center;padding:9px 6px}
  body.mopen .tools > .yr{width:100%;padding:8px 4px}
  body.mopen .tools > .count{grid-column:1/-1;text-align:center}
  main{padding-bottom:120px}
}
@media(max-width:600px){
  .hrow h1{font-size:15px}
}

/* ===== 底部标签栏（移动端） ===== */
.tabbar{display:none}
@media(max-width:900px){
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:90;background:#fff;border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
  .tbn{flex:1;border:none;background:none;font-size:11px;color:var(--dim);cursor:pointer;padding:6px 2px;border-radius:10px;line-height:1.5}
  .tbn.on{color:var(--accent);background:#eef4ff;font-weight:700}
  /* 触控区加大到 44px 标准 */
  .tbtn{min-height:44px;padding:9px 14px}
  .chip{min-height:36px;padding:6px 14px;display:inline-flex;align-items:center}
  .cbtn{width:40px;height:40px;font-size:15px}
  .tools2{gap:8px}
  .tools2 .tbtn{flex:1 1 auto}
  body{padding-bottom:0}
  main{padding-bottom:160px}
  .top{bottom:70px;right:12px}
}
/* 编辑弹层 */
#edmodal{display:none;position:fixed;inset:0;z-index:110;background:#0f172acc;padding:3vh 4vw;overflow:auto}
#edmodal.open{display:block}
#edmodal .mbox{max-width:560px;margin:0 auto;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.ebtn{flex:0 0 auto}

/* ===== 字号三档（A− / A+） ===== */
body.fs-lg{--fsT:19px;--fsB:16.5px;--fsE:16px;font-size:16px}
body.fs-xl{--fsT:21px;--fsB:18px;--fsE:17.5px;font-size:17px;line-height:1.85}
body.fs-xl .ex{padding:10px 14px}
.fsbox .tbtn{font-weight:700}
/* 拼写默写 */
.spellhint{font-size:19px;font-weight:800;letter-spacing:3px;margin:8px 0 2px;color:var(--text)}
.spellhint .spinfo{font-size:12px;font-weight:400;letter-spacing:0;color:var(--dim);margin-left:8px}
.spellrow{display:flex;gap:8px;margin-top:8px}
.spellrow input{flex:1;max-width:320px;padding:10px 14px;font-size:16px;font-family:monospace;letter-spacing:2px;border:1px solid var(--line);border-radius:0;outline:none}
.spellrow input:focus{border-color:var(--accent)}
/* 词库联动链接 */
.wl{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent);cursor:pointer;margin:0 1px}
.wl:hover{background:#fff3e0}
/* 易混组互链 */
.glinks{border-top:1px dashed var(--line);margin-top:10px;padding-top:7px;font-size:12.5px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.glinks .glb{font-size:11px;background:#f1f3f6;padding:1px 8px;border-radius:0;color:#59616d;flex:0 0 auto}
.glink{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent);cursor:pointer;font-weight:600}
.glink:hover{background:#fff3e0}
.glinkx{color:#9aa2ad}
/* 热力图 */
body.dark .spellrow input{background:#14161a;color:#e2e5ea;border-color:#333942}
body.dark .zhhint{border-left:4px solid var(--accent)}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.yr{border:1px solid var(--line);border-radius:8px;padding:5px 4px;font-size:12px;background:#fff;color:#374151}
.cbtn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:7px;min-width:26px;height:26px;font-size:13px;cursor:pointer;color:#94a3b8;flex:0 0 auto;line-height:1}
.cbtn.fav{background:#fef3c7;border-color:#f59e0b;color:#b45309}
.cbtn.know{background:#dcfce7;border-color:#22c55e;color:#15803d}
.chip.extra{border-style:dashed}
main.recite .bd,main.recite .ex{filter:blur(5px);transition:filter .2s;cursor:pointer}
main.recite .card.show .bd,main.recite .card.show .ex{filter:none}
main.recite .card{cursor:pointer}
body.dark{--bg:#0f172a;--panel:#1e293b;--line:#334155;--text:#e2e8f0;--dim:#94a3b8}
body.dark .card,body.dark header,body.dark aside,body.dark .chip,body.dark .tbtn,body.dark .yr,body.dark input[type=search],body.dark .top,body.dark .cbtn,body.dark .mbox{background:#1e293b;color:var(--text)}
body.dark .ex{background:#0b1220;border-color:#334155;color:#cbd5e1}
body.dark .node:hover{background:#334155}
body.dark .node.sel{background:#1e3a8a;color:#bfdbfe}
body.dark .k.x{background:#334155;color:#cbd5e1}
body.dark .times{background:#78350f;color:#fde68a}
body.dark .pop{background:#1e293b;border-color:#92400e;color:#fde68a}
body.dark .pop a{color:#fcd34d;border-color:#92400e}
body.dark mark{background:#fbbf24;color:#111827}
body.dark .mgrp:hover{background:#0b1220}
body.dark .card.flash{animation:fld 1.6s}
@keyframes fld{0%{background:#78350f;box-shadow:0 0 0 2px #f59e0b88}100%{background:#1e293b}}
#modal{display:none;position:fixed;inset:0;z-index:100;background:#0f172acc;padding:3vh 3vw;overflow:auto}
#modal.open{display:block}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:860px;margin:0 auto;padding:16px}
.mtabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mgrp{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mgrp:hover{background:#eef4ff}
.mgrp b{font-size:14px}
.mgrp .c{margin-left:auto;font-size:12px;color:var(--dim)}
.mback{margin-bottom:10px}
.tools2{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tbtn.ok{background:#dcfce7;border-color:#22c55e;color:#15803d}
.tbtn.bad{background:#fee2e2;border-color:#ef4444;color:#b91c1c}
body.dark .tbtn.ok{background:#14532d;color:#bbf7d0}
body.dark .tbtn.bad{background:#7f1d1d;color:#fecaca}
.srs .ti{font-size:16px}
.pbar{display:inline-block;width:44px;height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden;vertical-align:middle;flex:0 0 auto}
.pbar i{display:block;height:100%;background:#22c55e}
.pct{font-size:10px;color:var(--dim);flex:0 0 auto}
body.dark .pbar{background:#334155}
.dict{font-size:11px;color:var(--accent);text-decoration:none;margin-left:6px}
.pho{font-size:11px;color:var(--accent2);font-weight:400;margin-left:6px}
body.dark .pho{color:#c4b5fd}
.tbtn.ok{font-weight:700}
.xbtn{border:none;background:none;color:#ef4444;cursor:pointer;font-size:13px;padding:0 4px;flex:0 0 auto}
.xbtn:hover{color:#b91c1c}
.cloze .bd{font-size:16px;letter-spacing:.5px}


/* ===== 明日方舟风主题：锐角 / 深色顶栏 / 橙色点缀 ===== */
:root{--accent:#ff8200;--line:#d7dade;--bg:#eef0f2;--text:#17191d;--dim:#6d7480}
.card,.tbtn,.chip,input[type=search],.yr,.cbtn,.badge,.pop,.times,.mbox,.pbar,.top,.tbn,.mtool,.ebtn{border-radius:0}
.card{position:relative;border:1px solid var(--line)}
.card::before{content:"";position:absolute;left:0;top:0;width:12px;height:12px;background:var(--accent);clip-path:polygon(0 0,100% 0,0 100%)}
.card.flash{animation:akf 1.2s}
@keyframes akf{0%{background:#fff3e0;box-shadow:0 0 0 2px #ff820088}100%{background:var(--panel)}}
.k{clip-path:polygon(0 0,100% 0,calc(100% - 7px) 100%,0 100%);padding:2px 14px 2px 9px}
.ti{letter-spacing:.3px}
.chead{border-bottom:1px solid #eceef1;padding-bottom:6px}
.ex{border-left:3px solid var(--accent);background:#f7f8fa;position:relative;padding-right:34px}
.times{border-radius:0}
header{background:#212529;border-bottom:3px solid var(--accent)}
h1{color:#fff;font-weight:700;letter-spacing:1.5px}
h1 small{color:#9aa2ad}
.burger{background:#2c313a;border:1px solid #3d434c;color:#e2e5ea}
.fsbox .tbtn,.srow .tbtn,.tools .tbtn,.mtool{background:#2c313a;border:1px solid #3d434c;color:#e2e5ea}
.fsbox .tbtn:hover,.srow .tbtn:hover,.tools .tbtn:hover,.mtool:hover{background:#383e48;border-color:#4a515c}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#17191d;font-weight:700}
.tbtn.ok{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.tbtn.bad{background:#c92a2a;border-color:#c92a2a;color:#fff}
input[type=search]{background:#2c313a;border:1px solid #3d434c;color:#eef0f3}
input[type=search]::placeholder{color:#828a95}
input[type=search]:focus{border-color:var(--accent);box-shadow:none}
.yr{background:#2c313a;border:1px solid #3d434c;color:#e2e5ea}
.chip{clip-path:polygon(7px 0,100% 0,100% 100%,0 100%,0 7px)}
.chip.on{background:#212529;border-color:#212529;color:#fff}
.node.sel{background:#212529;color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.node.sel .ct{background:#3a4048;color:#c9ced6}
.pbar i{background:repeating-linear-gradient(45deg,#212529,#212529 3px,#4a515c 3px,#4a515c 6px)}
.uh{border-left:4px solid var(--accent);letter-spacing:1px}
.badge{background:var(--accent);color:#17191d;font-weight:800}
.tabbar{background:#212529;border-top:3px solid var(--accent)}
.tbn{color:#9aa2ad}
.tbn.on{color:var(--accent);background:transparent}
.top{background:#212529;color:#fff;border-color:#3d434c}
#dailyBox{border-left:4px solid var(--accent)}
.zhhint{margin:0 0 10px;padding:9px 14px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);font-size:13px;color:#374151}
.zhhint b{color:#17191d;margin-right:6px}
.sbtn{position:absolute;right:6px;top:7px;border:none;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:2px 4px;line-height:1}
.sbtn:hover{color:#c96a00}
body.dark{--bg:#101216;--panel:#1a1d22;--line:#2c313a;--text:#e2e5ea;--dim:#8a919c}
body.dark .card{background:#1a1d22;border-color:#2c313a}
body.dark .chead{border-bottom-color:#262b32}
body.dark .ex{background:#14161a;color:#c9ced6}
body.dark .chip{background:#1a1d22;border-color:#2c313a;color:#c9ced6}
body.dark .chip.on{background:var(--accent);border-color:var(--accent);color:#17191d}
body.dark aside{background:#14161a}
body.dark .node.sel{background:var(--accent);color:#17191d;box-shadow:none}
body.dark .node.sel .ct{background:#ffffff33;color:#17191d}
body.dark .tbtn,body.dark .yr{background:#22262c;border-color:#333942;color:#dfe3e8}
body.dark .tbtn.on{background:var(--accent);border-color:var(--accent);color:#17191d}
body.dark .tbtn.ok{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
body.dark .tbtn.bad{background:#c92a2a;border-color:#c92a2a;color:#fff}
body.dark header,body.dark .tabbar{background:#0c0e11}
body.dark input[type=search]{background:#14161a;border-color:#333942}
body.dark .top,body.dark #dailyBox{background:#1a1d22}
body.dark .pbar{background:#2c313a}
body.dark .pbar i{background:repeating-linear-gradient(45deg,#4a515c,#4a515c 3px,#6a727e 3px,#6a727e 6px)}
body.dark .zhhint{background:#1a1d22;color:#c9ced6}

/* ===== 打印样式 ===== */
@media print{
  header,aside,.tabbar,.top,#modal,#edmodal,#dailyBox,.tools,.srow,.hrow,.cbtn,.ebtn,.srsBtns,.dailyBox{display:none!important}
  body{height:auto;overflow:visible;background:#fff}
  .layout{display:block}
  main{overflow:visible;padding:0}
  #list{max-width:none}
  .card{break-inside:avoid;page-break-inside:avoid;margin-bottom:8px;border-color:#bbb}
  .srsAns{display:block!important}
}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px">
    <button class="burger" id="burger">☰</button>
    <h1>考研英语 · 笔记复习 <small id="count2"></small></h1>
    <div class="fsbox">
      <button class="tbtn" id="fsDn" title="减小字号" style="padding:4px 10px">A−</button>

Text 2","items":[{"k":"语法","t":"动名词做主语","b":"动词变 -ing 形式可作主语。","e":["I like to play games.","Playing games is interesting."]},{"k":"语法","t":"there be 句型","b":"there 不译为「这里」，应译为「有」。"},{"k":"语法","t":"As … as","b":"第一个 as 无意义（不译），中间部分和前面的连在一起；第二个 as 理解为「正如」。","e":["Your books are (as) useful as my books."]},{"k":"词汇","t":"universal","b":"adj. 普遍的；全体的；全世界的；共同的。n. 普遍性\n拓展：n. 一般概念；普通性　搭配：universal joint 万向节；万向接头；universal law 普遍规律；普遍法则　同根：adj. universalist 普救说的；adv. universally 普遍地；人人；到处；n. universe 宇宙；世界；领域；n. universality 普遍性；广泛性；一般性；多方面性　记忆：来自universe(n. 宇宙)","e":["free universal healthcare"]},{"k":"语法","t":"the 的用法","b":"① 上文提到过，第二次用 the；② 后置定语修饰，表特指；③ 固定搭配。","e":["I have an apple. The apple is red.","The apple coming from China is red."]},{"k":"词汇","t":"mortal","b":"adj. 终有一死的；致命的。mortality n. 死亡数量、死亡率。immortal adj. 不朽的、不死的\n拓展：adj. 凡人的；致死的；终有一死的；不共戴天的；n. 人类，凡人；n. 凡人　搭配：all men are mortal 前世今生　同根：adv. mortally 致命地；非常；n. mortality 死亡数，死亡率；必死性，必死的命运　记忆：mort(死)+al→致命的","e":["Her father’s death reminded her that she was mortal."]},{"k":"短语","t":"as well as","b":"① 表并列关系（＝and）；② as…as 结构。","e":["I have a book, as well as a phone.","I can play soccer as well as he does."]},{"k":"词汇","t":"Excess","b":"Excess n. 过度；过分；过多。\n拓展：adj.  过量的， 额外的；n.  超越； 过量， 过度；n. 过量，过度；adj. 过量的,额外的；n. 过量;过剩;超额;无节制；n. 超过，超额；过度，过量；无节制；adj. 额外的，过量的；附加的；adj. 过量的， 额外的；n. 过量， 过剩　搭配：in excess 过度；过量地；in excess of 超过；较…为多　同根：adj. excessive 过多的，极度的；过分的；adv. excessively 过分地；极度；n. excessiveness 过度（非常，格外）；冗余　记忆：ex(出) ＋ cess(行走) → 走出界限 → 过量， 过度","e":["Cut any excess fat from the meat."]},{"k":"词汇","t":"Excessive","b":"Excessive adj. 过多的\n拓展：adj. 过度的　搭配：excessive competition 过度竞争；excessive drinking 酗酒；过度饮酒　同根：adj. excess 额外的，过量的；附加的；adv. excessively 过分地；极度；n. excessiveness 过度（非常，格外）；冗余","e":["his excessive drinking"]},{"k":"语法","t":"since","b":"① 表「因为」，＝because / because of；② 后接「人 + 时间」，若后面没有时间，则很可能表①（＝because）。"},{"k":"词汇","t":"variation / offspring / gene（本课词汇）","b":"variation 变化；offspring 后代；gene 基因；the difference between A and B（注意 between 后并列用 and）"},{"k":"词汇","t":"mediocrity","b":"mediocrity n. 平庸、平常。"},{"k":"词汇","t":"mediocre","b":"mediocre adj. 平庸的"},{"k":"词汇","t":"Utopia","b":"n. 乌托邦（空想国）"},{"k":"语法","t":"those / these","b":"后面没有其他词时，一般默认指人。"},{"k":"词汇","t":"ignorant","b":"adj. 无知的；（对某事物）不了解的。be ignorant of sth.\n拓展：adj.  不知道的， 无知的　搭配：ignorant of 不知道；不懂　同根：adv. ignorantly 无知地；不学无术地；n. ignorance 无知，愚昧；不知，不懂；n. ignoramus 不学无术的人；无知的人","e":["an ignorant and uneducated man"]},{"k":"词汇","t":"savage","b":"n. 野蛮人；残暴的人。adj. 野蛮的；残暴的\n拓展：n. 未开化的人；粗鲁的人；残暴成性的人；v. 乱咬；粗暴的对待；n. 未开化的人， 野人　同根：adv. savagely 野蛮地；残忍地；n. savagery 野性；野蛮人；原始状态；n. savageness 天然；野蛮；残忍　记忆：Savage Garden 野人花园， 由两位来自澳大利亚的男孩组成的乐队","e":["a savage dog"]},{"k":"词汇","t":"comprehend 家族","b":"comprehend ＝ understand；comprehension n. ＝ understanding；comprehensive adj. 综合的（作文填词可用，可表「全面的」）"},{"k":"语法","t":"however 的位置","b":"位于逗号后，一般为转折；位于句首无逗号，一般表「无论……」"},{"k":"语法","t":"used to 三种结构","b":"used to do 过去常做（现在不做）；be/get used to doing 习惯做；be used to do 被用来做","e":["used to do","be/get used to doing","be used to do"]},{"k":"语法","t":"否定副词","b":"hardly / rarely / seldom / scarcely / not"}]},{"unit":"2000 Text 3","items":[{"k":"词汇","t":"attain","b":"v. 获得\n拓展：vt.  达到， 获得， 完成；v. 达到；完成；获得；v. 达到；v. 达到，实现；获得；到达；n. 成就；vt. 达到， 获得 <　同根：adj. attainable 可得到的；可达到的；可到达的；n. attainment 达到；成就；学识；n. attainability 可达到；可获得　记忆：at ＋ tain(拿住) → 稳稳拿住 → 获得","e":["More women are attaining positions of power."]},{"k":"语法","t":"what 引导的名词从句","b":"what 引导的部分整体是一个名词，可作主语或宾语。","e":["I like what you read.","What I like to read is important.","That I can read books is true.（that 引导的整个句子当主语，后面动词要用完整形式）"]},{"k":"词汇","t":"advocate","b":"v. 倡议、倡导。n. 倡导者\n拓展：vt.  拥护， 提倡， 主张；n.  拥护者， 提倡者； 辩护者， 律师；n. 辩护者，拥护者，鼓吹者；v. 拥护，提倡；v. 提倡，主张，拥护；n. 提倡者；支持者；律师；n. 提倡者， 鼓吹者， 支持者；vt. 提倡， 鼓吹　搭配：devil's advocate 故意持相反意见的人；故意唱反调的人　同根：n. advocacy 主张；拥护；辩护；n. advocator 提倡者，拥护者　记忆：ad(表加强) ＋ voc(声音， 喊叫) ＋ ate(做) → 大声喊 → 拥护， 提倡","e":["Extremists were openly advocating violence."]},{"k":"语法","t":"for / because / when 的强调","b":"for（介词，连词）＝because。when 主谓宾、because 主谓宾 → 表强调，是重点。"},{"k":"词汇","t":"far-fetched","b":"adj. 难以置信的、牵强的。"},{"k":"短语","t":"with regard to / with respect to","b":"＝about，关于"},{"k":"语法","t":"rather","b":"rather adv. ＝ very；rather than 宁愿，相当于「而不是」"},{"k":"词汇","t":"corresponding","b":"adj. 相应的\n拓展：adj. 相当的，相应的；一致的；通信的；v. 类似（correspond的ing形式）；相配　搭配：corresponding period 同期；corresponding point 对应点　同根：adv. correspondingly 相应地，相对地；n. correspondence 通信；一致；相当；n. correspondent 通讯记者；客户；通信者；代理商行；vi. correspond 符合，一致；相应；通信　记忆：cor(共同)+respond(响应)→揭竿而起， 一致响应→一致","e":["The war and the corresponding fall in trade have had a devastating effect on the country."]},{"k":"词汇","t":"interpret","b":"v. 解释、口译\n拓展：v. 说明；口译；vi. 做口译　搭配：right to interpret 解释权　同根：adj. interpretive 解释的；作为说明的；adj. interpretative 解释的；作为说明的；adj. interpretable 可说明的；可判断的；可翻译的；n. interpretation 解释；翻译；演出　记忆：inter(在…之间) ＋ pret → 在两种语言中间说 → 口译","e":["They spoke good Spanish, and promised to interpret for me."]},{"k":"词汇","t":"hamper","b":"v. 限制、妨碍\n拓展：n. 食盒，食篮；阻碍物　记忆：本义指“有盖的大篮子”， 拿着它走路常常绊脚， 所以引申为“妨碍”","e":["She tried to run, but was hampered by her heavy suitcase."]},{"k":"语法","t":"Instead","b":"instead of + ving / sh / n，不做什么、而是做……\n拓展：adv.  作为替代； 却， 反而　搭配：instead of 代替；不是…而是…","e":["Geoff didn’t study law. Instead, he decided to become an actor."]},{"k":"词汇","t":"词群","b":"review 回顾、复习；merits 优点；indicative of 表明了；transient 短暂的"}]},{"unit":"2000 Text 4","items":[{"k":"词汇","t":"produce 家族","b":"produce v. 生产（抽象也可：视频、想法）；n. 产品（尤指农产品）。production n. 生产。productive adj. 有生产力的。productivity n. 生产效率"},{"k":"词汇","t":"envy / entry；harmony / praise","b":"envy 羡慕 / entry 进入；harmony 和谐 / praise 赞扬。表「强调」的词：emphasis n. / emphasize v. / highlight / underline"},{"k":"语法","t":"as","b":"连词：因为、当、正如；介词：作为"},{"k":"短语","t":"the coming of age","b":"成年、达到法定年龄"},{"k":"短语","t":"be dissatisfaction with","b":"对……不满意"},{"k":"词汇","t":"counterpart","b":"n. 同行、同（职位级别）；本身有无意义（有相同情况的人或物）\n拓展：n. 对等物；n. 对应的人(或物)；n. 副本；配对物；极相似的人 let cur = null, kw = "", cat = "全部";
const KC = {"语法":"g","词汇":"w","短语":"p"};
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\u0022":"&quot;"}[c]));


const STOP = new Set(["的","与","和","tips","家族","结构","用法","词群","类","a","an","the","to","of","in","as","is","are","be","sb","sth","by","with","for","and","or","it","out","up","on","at","do","so"]);
function toks(t){ return (t||"").toLowerCase().split(/[/,，、;；()（）\[\]\.\s]+/).map(s=>s.trim()).filter(s=>s.length>1 && !STOP.has(s)); }

const wordIndex = new Map();
const items = [];
DATA.forEach((unit, ui) => unit.items.forEach((it, ii) => {
  const tk = toks(it.t);
  items.push({ ui, ii, tk });
  tk.forEach(w => {
    if (!wordIndex.has(w)) wordIndex.set(w, []);
    wordIndex.get(w).push({ u: ui, i: ii, t: it.t, k: it.k });
  });
}));


function hl(s){
  const t = esc(s);
  if(!kw) return t;
  const k = esc(kw).replace(/[.*+?^~()|[\]\\]/g, "\\$&");
  try { return t.replace(new RegExp(k, "gi"), m => "<mark>" + m + "</mark>"); }
  catch(e){ return t; }
}


function groupOf(unit){
  const m = unit.unit.match(/^(\d{4})/);
  return m ? m[1] + "年" : "补充专题";
}
function buildTree(){
  const root = document.getElementById("tree");
  root.innerHTML = "";
  const li0 = document.createElement("li");
  li0.innerHTML = '<div class="node" id="allNode"><span class="nm">全部笔记</span><span class="ct">' + DATA.reduce((a,u)=>a+u.items.length,0) + '</span></div>';
  li0.querySelector(".node").onclick = () => { cur = null; buildTree(); render(); closeNav(); };
  if (cur === null) li0.querySelector(".node").classList.add("sel");
  root.appendChild(li0);
  const groups = new Map();
  DATA.forEach((u, i) => {
    const g = groupOf(u);
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(i);
  });
  const sorted = [...groups.entries()].sort((a, b) => (a[0] === "补充专题") - (b[0] === "补充专题") || a[0].localeCompare(b[0]));
  for (const [g, arr] of sorted) {
    const li = document.createElement("li");
    li.className = "grp open";
    const head = document.createElement("div");
    head.className = "node";
    head.innerHTML = '<span class="tri"></span><span class="nm">' + esc(g) + '</span><span class="ct">' +
      arr.reduce((a, i) => a + DATA[i].items.length, 0) + '</span>';
    head.onclick = () => li.classList.toggle("open");
    li.appendChild(head);
    const ul = document.createElement("ul");
    ul.className = "kids";
    arr.forEach(i => {
      const t = document.createElement("li");
      const n = document.createElement("div");
      n.className = "node" + (cur === i ? " sel" : "");
      n.innerHTML = '<span class="nm"></span><span class="ct">' + DATA[i].items.length + '</span>';
      n.querySelector(".nm").textContent = DATA[i].unit;
      n.onclick = () => { cur = i; buildTree(); render(); closeNav(); };
      t.appendChild(n);
      ul.appendChild(t);
    });
    li.appendChild(ul);
    root.appendChild(li);
  }
}


function countFor(tk){
  let best = null, n = 0;
  tk.forEach(w => {
    const arr = wordIndex.get(w) || [];
    const units = new Set(arr.map(x => x.u));
    if (units.size > n) { n = units.size; best = w; }
  });
  return { token: best, n };
}
function relatedFor(tk, ui, ii){
  const out = [];
  tk.forEach(w => {
    const arr = wordIndex.get(w) || [];
    const others = arr.filter(x => !(x.u === ui && x.i === ii));
    if (others.length) out.push({ w, n: others.length, first: others[0] });
  });
  return out.slice(0, 8);
}


function cardHtml(ui, ii){
  const it = DATA[ui].items[ii];
  const tk = items.find(x => x.ui === ui && x.ii === ii).tk;
  const c = countFor(tk);
  const id = "c-" + ui + "-" + ii;
  let h = '<div class="card" id="' + id + '"><div class="chead">';
  h += '<span class="k ' + (KC[it.k] || "x") + '">' + esc(it.k) + '</span> ';
  h += '<span class="ti">' + hl(it.t) + '</span>';
  if (c.n > 1) h += '<span class="times" data-tk="' + esc(c.token) + '">出现 ' + c.n + ' 处 ▾</span>';
  h += '</div>';
  if (it.b) h += '<div class="bd">' + hl(it.b) + '</div>';
  (it.e || []).forEach(x => { h += '<div class="ex">' + hl(x) + '</div>'; });
  if (c.n > 1) {
    h += '<div class="pop" id="pop-' + id + '"><b>' + esc(c.token) + '</b> 共 ' + c.n + ' 处：';
    (wordIndex.get(c.token) || []).forEach(o => {
      if (o.u === ui && o.i === ii) return;
      h += '<a data-jump="' + o.u + '-' + o.i + '">' + esc(DATA[o.u].unit) + ' · ' + esc(o.t) + '</a>';
    });
    h += '</div>';
  }
  const rel = relatedFor(tk, ui, ii);
  if (rel.length) {
    h += '<div class="rel"><span class="lb">关联：</span>';
    rel.forEach(r => { h += '<a data-jump="' + r.first.u + '-' + r.first.i + '">' + esc(r.w) + '×' + r.n + '</a>'; });
    h += '</div>';
  }
  return h + '</div>';
}


function buildChips(){
  const counts = {"全部": 0, "词汇": 0, "语法": 0, "短语": 0};
  DATA.forEach(u => u.items.forEach(it => {
    counts["全部"]++;
    if (counts[it.k] === undefined) counts[it.k] = 0;
    counts[it.k]++;
  }));
  const box = document.getElementById("chips");
  box.innerHTML = "";
  Object.keys(counts).forEach(k => {
    const c = document.createElement("span");
    c.className = "chip" + (cat === k ? " on" : "");
    c.innerHTML = k + " <b>" + counts[k] + "</b>";
    c.onclick = () => { cat = k; buildChips(); render(); };
    box.appendChild(c);
  });
}
function match(it, ui, ii){
  if (cat !== "全部" && it.k !== cat) return false;
  if (window.extraMatch && !extraMatch(ui, ii)) return false;
  if (!kw) return true;
  return JSON.stringify(it).toLowerCase().indexOf(kw.toLowerCase()) >= 0;
}
function render(){
  let html = "", n = 0;
  const units = (cur === null) ? DATA.map((u, i) => i) : [cur];
  units.forEach(ui => {
    const u = DATA[ui];
    const hits = u.items.map((it, ii) => ({ it, ii })).filter(x => match(x.it, ui, x.ii));
    if (!hits.length) return;
    html += '<h2 class="uh">' + esc(u.unit) + '</h2>';
    hits.forEach(x => { html += cardHtml(ui, x.ii); n++; });
  });
  document.getElementById("list").innerHTML = html || '<div class="empty">没有匹配的笔记</div>';
  document.getElementById("count").textContent = "当前 " + n + " 条 / 共 " + DATA.reduce((a,u)=>a+u.items.length,0) + " 条";
  document.getElementById("count2").textContent = "";
  document.getElementById("main").scrollTop = 0;
}


function closeNav(){ document.body.classList.remove("nav"); }
function jump(id){
  const p = id.split("-");
  const ui = +p[0], ii = +p[1];
  if (cur !== null && cur !== ui) { cur = null; }
  if (cur === null) render();
  if (!kw && cat === "全部") { /* already all */ } else { kw = ""; document.getElementById("q").value = ""; render(); }
  const el = document.getElementById("c-" + ui + "-" + ii);
  if (el) {
    if (el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }
  buildTree(); buildChips(); closeNav();
}

  function qzShuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function qzExtract(it, tok, g) {
    var b = (it.b || "");
    var low = b.toLowerCase(), t = tok.toLowerCase();
    var from = 0;
    while (true) {
      var at = low.indexOf(t, from);
      if (at < 0) return null;
      from = at + t.length;
      var prev = at > 0 ? b[at - 1] : "";
      if (prev === "（" || prev === "(") continue;    // 括号里的交叉引用不是释义
      var seg = b.slice(at + t.length, at + t.length + 34);
      seg = seg.replace(/^[\s:：＝=→\-—、,，]+/, "");
      var cut = seg.search(/[｜;；,，。、\/／]/);
      if (cut > 1) seg = seg.slice(0, cut);
      seg = seg.replace(/^[\s（(]+/, "");
      seg = seg.replace(/^([^（）()]{0,6})）/, "$1");      // 「farther（距离）更远」→「距离更远」
      seg = seg.replace(/（(易混|本课|tips)[^）]*）/, "");  // 去掉笔记自带注记
      seg = seg.replace(/[\s（）()\/／、,，-]+$/, "").trim();
      if (!/[\u4e00-\u9fa5]{2,}/.test(seg)) continue; // 必须有真实中文释义，"to)"这类碎片直接淘汰
      if (seg.length > 26) continue;                   // 截到半截的长释义不要
      if (g.toks.some(function (t2) { return t2 !== tok && seg.toLowerCase().indexOf(t2) >= 0; })) continue;
      return seg;
    }

  function quizBuild() {

          var seg = qzExtract(it, tok, g);

  /* ===== 云互通：跨设备同步（ntfy.sh 免费信道，gzip 分块，同步码即信道名=密码） ===== */
  var CLOUD_BASE = "https://ntfy.sh";

  function packSync() {

  async function gz(str) {
    if (typeof CompressionStream === "undefined") throw new Error("浏览器过旧，不支持压缩同步");
    const cs = new CompressionStream("gzip");

  }
  async function gunzip(u8) {

  async function cloudPush(silent) {

  /* 实时订阅：长连接 + since 游标。跨实例发布会延迟进缓存，靠断线重连时的 since 重放补齐（分钟级收敛） */
  var subAbort = null;

        let buf = "";

          buf += dec.decode(value, { stream: true });

              const ev = JSON.parse(line);

  /* ---- 编辑词条弹层 ---- */
  var edm = document.createElement("div"); edm.id = "edmodal"; document.body.appendChild(edm);
  function openEdit(id) {
    var p = id.split("-"), it = DATA[+p[0]].items[+p[1]];
    if (!it) return;
    var edited = kedit[id];
    edm.innerHTML = '<div class="mbox" style="max-width:560px">' +
      '<h3 style="font-size:15px;margin-bottom:2px">编辑词条</h3>' +
      '<div style="font-size:11px;color:var(--dim);margin-bottom:8px">' + esc(DATA[+p[0]].unit) + ' · 标题不可改（会影响索引）</div>' +
      '<div style="font-size:16px;font-weight:700;margin-bottom:8px">' + esc(it.t) + '</div>' +
      '<div style="font-size:12px;color:var(--dim)">释义</div>' +
      '<textarea id="edB" style="width:100%;min-height:88px;font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:8px;resize:vertical">' + esc(it.b || "") + '</textarea>' +
      '<div style="font-size:12px;color:var(--dim);margin-top:6px">例句（每行一句）</div>' +
      '<textarea id="edE" style="width:100%;min-height:66px;font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:8px;resize:vertical">' + esc((it.e || []).join("\n")) + '</textarea>' +
      '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="tbtn ok" id="edSave">保存</button>' +
      (edited ? '<button class="tbtn" id="edReset">还原原文</button>' : '') +
      '<button class="tbtn" id="edCancel">取消</button></div></div>';
    edm.classList.add("open");
    document.getElementById("edSave").onclick = function () {
      var nb = document.getElementById("edB").value.trim();
      var ne = document.getElementById("edE").value.split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
      saveEdit(id, nb !== (it.b || "") ? nb : null, JSON.stringify(ne) !== JSON.stringify(it.e || []) ? ne : null);
      edm.classList.remove("open");
      if (srsMode) srsRender(); else if (randMode) randRender(); else if (!quizMode) render();
      if (quizMode) { quizList = quizBuild(); qzRender(); }   // 释义改了，重出题
    };
    if (document.getElementById("edReset")) document.getElementById("edReset").onclick = function () {
      delete kedit[id];
      try { localStorage.setItem("kedit", JSON.stringify(kedit)); } catch (e) { saveFailBar(); }
      window.location.reload();   // 还原原文最稳妥：重载后从原始 DATA 重建
    };
    document.getElementById("edCancel").onclick = function () { edm.classList.remove("open"); };
  }

  enhance(); buildChips(); buildTree();
  render();               // 重渲染：首屏带上打卡条与装饰
  try {
    updateDueBadge();
    var prompted = wrongPrompt();
    if (!prompted) remindBackup();
    if (kcloud.id) { cloudPull(true); cloudSubscribe(); }   // 补历史 + 实时订阅
  } catch (e) {}
})();

</script>
